<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مسار — إدارة مالية ذكية</title>
<meta name="theme-color" content="#0b7a7f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════ TOKENS ═══════════ */
:root,[data-theme="light"]{
  --bg:#f2f5fa;--surface:#fff;--border:#e4eaf4;
  --text:#1a1d24;--muted:#7c8596;
  --primary:#0b7a7f;--primary-l:#e0f5f5;--primary-d:#086063;
  --green:#27a663;--green-l:#e6f9f0;
  --red:#d14e4e;--red-l:#fdeaea;
  --orange:#e07b22;--orange-l:#fef3e6;
  --blue:#2464e8;--blue-l:#e8f0ff;
  --shadow1:0 1px 4px rgba(0,0,0,.07);--shadow2:0 4px 18px rgba(0,0,0,.1);
  --r:16px;
}
[data-theme="dark"]{
  --bg:#111318;--surface:#1c1f28;--border:#2a2f3d;
  --text:#e4e8f2;--muted:#7a8299;
  --primary:#3da3a9;--primary-l:#162630;--primary-d:#4eb8bf;
  --green:#3ab573;--green-l:#122b1c;
  --red:#e07070;--red-l:#2d1616;
  --orange:#f0953a;--orange-l:#2d1e0f;
  --blue:#5b8af0;--blue-l:#111e3a;
  --shadow1:0 1px 4px rgba(0,0,0,.3);--shadow2:0 4px 18px rgba(0,0,0,.4);
}
/* ═══════════ BASE ═══════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth;height:100%}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);
  height:100%;display:flex;flex-direction:column;
  max-width:480px;margin:auto;position:relative;overflow:hidden}
/* ═══════════ SPLASH ═══════════ */
#splash{position:fixed;inset:0;z-index:9999;
  background:linear-gradient(150deg,#0b7a7f,#0d9ea8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.splash-logo{width:96px;height:96px;border-radius:28px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:3rem;
  box-shadow:0 8px 32px rgba(0,0,0,.2);animation:splash-pop .6s cubic-bezier(.17,.67,.55,1.3) both}
@keyframes splash-pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.splash-title{font-size:2.2rem;font-weight:900;color:#fff;letter-spacing:2px;animation:fade-up .6s .3s both}
.splash-sub{font-size:.9rem;color:rgba(255,255,255,.8);animation:fade-up .6s .5s both}
@keyframes fade-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.splash-dots{display:flex;gap:8px;animation:fade-up .6s .7s both}
.splash-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .3s}
.splash-dot.active{background:#fff;transform:scale(1.4)}
/* ═══════════ REGISTER ═══════════ */
#register{position:fixed;inset:0;z-index:9998;
  background:linear-gradient(160deg,#0d9ea8,#0b7a7f);
  display:none;flex-direction:column;overflow-y:auto}
.reg-hero{padding:48px 28px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.reg-hero-icon{font-size:3rem;animation:splash-pop .5s both}
.reg-hero h1{font-size:1.9rem;font-weight:900;color:#fff}
.reg-hero p{font-size:.88rem;color:rgba(255,255,255,.85)}
.reg-body{background:var(--bg);border-radius:28px 28px 0 0;padding:28px 22px 40px;flex:1}
.reg-step{font-size:.72rem;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.reg-body h2{font-size:1.25rem;font-weight:900;margin-bottom:18px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-group label{font-size:.82rem;font-weight:700;color:var(--muted)}
.form-group input,.form-group select{border:2px solid var(--border);border-radius:13px;
  padding:12px 14px;font-family:'Cairo',sans-serif;font-size:.95rem;
  background:var(--surface);color:var(--text);transition:border .2s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
.opt-group{display:flex;gap:8px;flex-wrap:wrap}
.opt-btn{padding:9px 18px;border-radius:12px;border:2px solid var(--border);
  background:var(--surface);font-family:'Cairo',sans-serif;font-size:.88rem;
  font-weight:700;cursor:pointer;color:var(--text);transition:all .2s}
.opt-btn.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
/* ═══════════ PIN OVERLAY ═══════════ */
#pin-overlay{position:fixed;inset:0;z-index:9997;
  background:linear-gradient(150deg,#0b7a7f,#0a6b70);
  display:none;flex-direction:column;align-items:center;justify-content:center}
.pin-box{width:min(340px,92%);background:var(--surface);border-radius:28px;
  padding:32px 24px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.pin-logo{font-size:2.5rem;margin-bottom:12px}
.pin-title{font-size:1.1rem;font-weight:900;margin-bottom:4px}
.pin-sub{font-size:.85rem;color:var(--muted);margin-bottom:18px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:16px 0}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--border);
  transition:all .2s;background:transparent}
.pin-dot.filled{background:var(--primary);border-color:var(--primary)}
.pin-err{font-size:.82rem;color:var(--red);font-weight:700;min-height:20px;margin-bottom:6px}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.pin-key{height:60px;border-radius:16px;border:none;background:var(--bg);
  font-family:'Cairo',sans-serif;font-size:1.4rem;font-weight:800;cursor:pointer;
  color:var(--text);transition:all .15s;-webkit-tap-highlight-color:transparent}
.pin-key:active{background:var(--primary);color:#fff;transform:scale(.94)}
.pin-key-empty{background:transparent;cursor:default}
.pin-key-empty:active{background:transparent;transform:none}
.pin-forgot{margin-top:14px;background:none;border:none;color:var(--primary);
  font-family:'Cairo',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer}
/* ═══════════ ONBOARDING ═══════════ */
#onboard{position:fixed;inset:0;z-index:9990;background:rgba(0,0,0,.0);pointer-events:none;transition:background .3s}
#onboard.active{background:rgba(0,0,0,.72);pointer-events:all}
.ob-highlight{position:fixed;border:3px solid var(--primary);border-radius:16px;
  box-shadow:0 0 0 4000px rgba(0,0,0,.72);z-index:1;pointer-events:none;animation:ob-pulse 1.5s infinite}
@keyframes ob-pulse{0%,100%{box-shadow:0 0 0 4000px rgba(0,0,0,.72),0 0 0 0 rgba(11,122,127,.6)}50%{box-shadow:0 0 0 4000px rgba(0,0,0,.72),0 0 0 8px rgba(11,122,127,.0)}}
.ob-card{position:fixed;background:var(--surface);border-radius:20px;padding:18px 18px 14px;
  box-shadow:0 8px 32px rgba(0,0,0,.3);z-index:2;direction:rtl;
  animation:ob-card-in .3s cubic-bezier(.17,.67,.55,1.1)}
@keyframes ob-card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ob-step{font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.ob-title{font-size:1.1rem;font-weight:900;margin-bottom:6px}
.ob-desc{font-size:.85rem;color:var(--muted);line-height:1.6;margin-bottom:12px}
.ob-next{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:10px 20px;font-family:'Cairo',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;width:100%}
.ob-skip{position:fixed;top:18px;left:18px;z-index:3;background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:10px;padding:7px 16px;font-family:'Cairo',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer}
.ob-progress{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.ob-pip{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:all .3s}
.ob-pip.active{background:#fff;width:22px;border-radius:4px}
/* ═══════════ LAYOUT ═══════════ */
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:80px;scroll-behavior:smooth}
#bottom-nav{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);
  grid-template-columns:repeat(5,1fr);height:72px;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.07)}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;cursor:pointer;color:var(--muted);
  font-family:'Cairo',sans-serif;padding:8px 4px;font-size:.7rem;font-weight:700;
  transition:color .2s,transform .15s;-webkit-tap-highlight-color:transparent}
.nav-btn:active{transform:scale(.9)}
.nav-btn.active{color:var(--primary)}
.nav-btn .nb-icon{font-size:1.45rem}
#nav-add .nb-icon{width:46px;height:46px;background:var(--primary);border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;
  margin-top:-10px;box-shadow:0 4px 14px rgba(11,122,127,.45)}
/* ═══════════ HEADER ═══════════ */
.top-header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.user-name{font-size:1.15rem;font-weight:900}
.user-date{font-size:.78rem;color:var(--muted);margin-top:2px}
.user-meta{flex:1;text-align:center}
.notif-btn{width:42px;height:42px;border-radius:13px;background:var(--surface);border:1.5px solid var(--border);font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.notif-btn::before{content:'🔔'}
.icon-btn{width:42px;height:42px;border-radius:13px;background:var(--surface);border:1.5px solid var(--border);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.avatar{display:flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;font-weight:900;font-size:1.1rem}
/* ═══════════ BALANCE ═══════════ */
.balance-card{margin:8px 14px 10px;padding:20px;background:linear-gradient(135deg,var(--primary),var(--primary-d));
  border-radius:22px;color:#fff;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 6px 24px rgba(11,122,127,.35)}
.balance-label{font-size:.8rem;opacity:.85;margin-bottom:4px;font-weight:700}
.balance-value{font-size:2rem;font-weight:900;letter-spacing:.5px}
.balance-sub{font-size:.78rem;opacity:.75;margin-top:3px}
.ring-wrap{position:relative;width:80px;height:80px;flex-shrink:0}
.ring-wrap svg{width:88px;height:88px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.2);stroke-width:7}
.ring-fill{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem}
/* ═══════════ ALERTS ═══════════ */
.notif-box{margin:4px 14px;padding:10px 14px;border-radius:13px;font-size:.84rem;font-weight:700;line-height:1.5}
.nb-red{background:var(--red-l);color:var(--red)}
.nb-yellow{background:var(--orange-l);color:var(--orange)}
.nb-green{background:var(--green-l);color:var(--green)}
/* ═══════════ METRICS ═══════════ */
.cards-list{padding:4px 14px 12px;display:flex;flex-direction:column;gap:10px}
.metric-card{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--shadow1);transition:box-shadow .2s,transform .15s;-webkit-tap-highlight-color:transparent}
.metric-card:active{transform:scale(.98);box-shadow:var(--shadow2)}
.metric-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.ic-teal{background:#e0f5f5}.ic-green{background:#e6f9f0}.ic-yellow{background:#fef8e0}.ic-red{background:#fdeaea}.ic-blue{background:var(--blue-l)}
[data-theme="dark"] .ic-teal{background:#162a2c}[data-theme="dark"] .ic-green{background:#112318}[data-theme="dark"] .ic-yellow{background:#231c0c}[data-theme="dark"] .ic-red{background:#2a1010}[data-theme="dark"] .ic-blue{background:#0f1b34}
.metric-mid{flex:1}.metric-title{font-weight:800;font-size:.95rem}.metric-sub{font-size:.75rem;color:var(--muted);margin-top:2px}
.metric-right{text-align:left}.metric-val{font-weight:900;font-size:1rem}
.trend-up{font-size:.75rem;color:var(--red);font-weight:700}.trend-ok{font-size:.75rem;color:var(--green);font-weight:700}
.arrow{color:var(--border);font-size:1.3rem;flex-shrink:0}
/* ═══════════ ADD ═══════════ */
.add-grid{padding:0 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.add-card{background:var(--surface);border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;cursor:pointer;border:2px solid transparent;box-shadow:var(--shadow1);transition:all .2s;-webkit-tap-highlight-color:transparent}
.add-card.active{border-color:var(--primary);background:var(--primary-l)}
.add-icon{font-size:1.4rem}.add-label{font-size:.7rem;font-weight:800;color:var(--muted)}
.add-card.active .add-label{color:var(--primary)}
.form-wrap{padding:14px 14px 0}
.form-card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow1)}
.form-title{font-size:1.05rem;font-weight:900;margin-bottom:14px}
.btn-primary{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:14px;font-family:'Cairo',sans-serif;font-size:.95rem;font-weight:800;cursor:pointer;margin-top:6px;transition:background .2s,transform .15s;-webkit-tap-highlight-color:transparent}
.btn-primary:active{background:var(--primary-d);transform:scale(.98)}
/* ═══════════ RECEIPT ═══════════ */
.receipt-upload-area{border:2.5px dashed var(--border);border-radius:18px;padding:28px;text-align:center;cursor:pointer;transition:border-color .2s;background:var(--bg)}
.receipt-upload-area:active{border-color:var(--primary);background:var(--primary-l)}
/* ═══════════ LISTS ═══════════ */
.sec-head{padding:14px 16px 6px;font-size:.82rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.list-wrap{padding:0 14px;display:flex;flex-direction:column;gap:8px}
.list-item{background:var(--surface);border-radius:15px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow1)}
.li-del{background:var(--red-l);border:none;border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:.95rem;flex-shrink:0}
.li-info{flex:1}.li-name{font-weight:800;font-size:.9rem}.li-sub{font-size:.75rem;color:var(--muted);margin-top:2px}
.li-amount{font-weight:900;font-size:.95rem;color:var(--primary)}
.prog-wrap{height:7px;background:var(--border);border-radius:10px;overflow:hidden}
.prog-fill{height:100%;background:var(--primary);border-radius:10px;transition:width .6s}
/* ═══════════ REPORTS ═══════════ */
.score-card{margin:10px 14px;padding:20px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow1);display:flex;align-items:center;gap:16px}
.score-num{font-size:2.8rem;font-weight:900;line-height:1}.score-lbl{font-size:1rem;font-weight:800}
.compare-btn{display:block;margin:0 14px 10px;padding:13px 18px;background:var(--surface);border:2px solid var(--primary);border-radius:16px;font-family:'Cairo',sans-serif;font-size:.9rem;font-weight:800;color:var(--primary);cursor:pointer;text-align:right;width:calc(100% - 28px);box-shadow:var(--shadow1)}
.kpi-grid{padding:0 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi-box{border-radius:14px;padding:12px 10px}.kpi-icon{font-size:1.2rem;margin-bottom:4px}.kpi-lbl{font-size:.72rem;color:var(--muted);font-weight:700}.kpi-val{font-size:.88rem;font-weight:900;margin-top:2px}
.cat-bar{background:var(--surface);border-radius:13px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow1)}
.cat-row{display:flex;justify-content:space-between;margin-bottom:5px}.cat-name{font-weight:800;font-size:.85rem}.cat-amt{font-size:.82rem;color:var(--muted)}
/* ═══════════ COMPARE ═══════════ */
.compare-card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow1)}
.cc-month{font-weight:900;font-size:.92rem;margin-bottom:6px}
.cc-exp{font-size:.82rem;margin-bottom:3px}.cc-sav{font-size:.82rem}
.back-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:11px;padding:8px 14px;font-family:'Cairo',sans-serif;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--text)}
/* ═══════════ TIPS ═══════════ */
.ai-header{padding:12px 16px 0}.ai-title{font-size:1.05rem;font-weight:900}.ai-sub{font-size:.78rem;color:var(--muted)}
.chat-wrap{margin:10px 14px 0;background:var(--surface);border-radius:18px;padding:14px;max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow1)}
.chat-msg{max-width:86%;padding:9px 13px;border-radius:14px;font-size:.85rem;line-height:1.55;white-space:pre-wrap}
.msg-ai{background:var(--primary-l);color:var(--text);border-bottom-right-radius:4px;align-self:flex-start}
.msg-user{background:var(--primary);color:#fff;border-bottom-left-radius:4px;align-self:flex-end}
.chat-input-wrap{margin:8px 14px;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:16px;padding:6px 6px 6px 14px;border:1.5px solid var(--border);box-shadow:var(--shadow1)}
.chat-input{flex:1;border:none;background:none;font-family:'Cairo',sans-serif;font-size:.9rem;color:var(--text);outline:none}
.chat-send{width:38px;height:38px;border-radius:11px;background:var(--primary);color:#fff;border:none;font-size:1.1rem;cursor:pointer}
.tip-box{margin:5px 14px;padding:11px 14px;border-radius:13px;font-size:.85rem;font-weight:700;line-height:1.5}
.tip-r{background:var(--red-l);color:var(--red)}.tip-y{background:var(--orange-l);color:var(--orange)}.tip-g{background:var(--green-l);color:var(--green)}.tip-b{background:var(--blue-l);color:var(--blue)}
.range-wrap{padding:4px 14px}.range-wrap label{font-size:.82rem;font-weight:800;color:var(--muted);display:block;margin-bottom:4px}
.range-wrap input[type=range]{width:100%;accent-color:var(--primary)}
.etf-card{margin:8px 14px;background:linear-gradient(135deg,var(--primary),var(--primary-d));border-radius:18px;padding:18px;color:#fff}
.etf-grid{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center}
.etf-lbl{font-size:.78rem;opacity:.8;margin-bottom:4px}.etf-val{font-size:1rem;font-weight:900}
.etf-profit{color:#a0ffd0}.etf-total{color:#ffe084}
/* ═══════════ ACCOUNT/SETTINGS ═══════════ */
.account-card{margin:10px 14px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow1)}
.settings-section{margin:0 14px 8px;background:var(--surface);border-radius:18px;padding:4px 0;box-shadow:var(--shadow1);overflow:hidden}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}.sr-label{font-size:.9rem;font-weight:700}
.toggle-switch{position:relative;width:48px;height:26px}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:13px;cursor:pointer;transition:background .3s}
.toggle-slider::before{content:'';position:absolute;height:20px;width:20px;border-radius:50%;background:#fff;left:3px;top:3px;transition:transform .3s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle-switch input:checked+.toggle-slider{background:var(--primary)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(22px)}

/* ═══════════ PIN FORGOT / RESET ═══════════ */
.pin-forgot-btn{margin-top:14px;background:none;border:none;color:var(--muted);font-family:'Cairo',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.pin-forgot-btn:active{color:var(--primary)}
.pin-screen{width:min(340px,92%);background:var(--surface);border-radius:28px;padding:28px 24px 24px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.pin-back{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.18);border:none;border-radius:10px;padding:7px 14px;color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer}
.pin-input-wrap{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.pin-text-input{border:2px solid var(--border);border-radius:13px;padding:12px 14px;font-family:'Cairo',sans-serif;font-size:.95rem;background:var(--bg);color:var(--text);text-align:center;width:100%;transition:border .2s;outline:none;direction:ltr}
.pin-text-input:focus{border-color:var(--primary)}
.pin-status-icon{font-size:2.4rem;margin-bottom:8px}
.pin-sent-box{background:var(--green-l);border-radius:14px;padding:14px;margin:10px 0;font-size:.85rem;color:var(--green);font-weight:700;line-height:1.6}
.pin-email-preview{font-size:.78rem;color:var(--muted);word-break:break-all;margin-top:4px}
.pin-code-hint{font-size:.76rem;color:var(--muted);margin-top:4px}
.pin-resend{background:none;border:none;color:var(--primary);font-family:'Cairo',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;margin-top:6px;text-decoration:underline;text-underline-offset:2px}

/* ═══════════ TOAST ═══════════ */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1d24;color:#fff;padding:11px 22px;border-radius:14px;font-size:.88rem;font-weight:700;opacity:0;z-index:9000;transition:all .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#content::-webkit-scrollbar{width:4px}
#content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

  <div class="splash-dots">
    <div class="splash-dot active"></div>
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
  </div>
</div>

<!-- REGISTER -->
<div id="register">

  </div>
  <div id="reg-body-area" class="reg-body">

  <button class="nav-btn" id="nav-account" onclick="navigate('account')">
